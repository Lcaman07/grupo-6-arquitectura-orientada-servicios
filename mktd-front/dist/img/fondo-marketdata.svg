    <circle cx="1210" cy="580" r="5" opacity=".8"/><circle cx="1120" cy="620" r="4" opacity=".7"/><circle cx="1060" cy="560" r="6"/>
    <circle cx="990" cy="600" r="4" opacity=".7"/><circle cx="940" cy="520" r="5" opacity=".8"/><circle cx="980" cy="450" r="6"/>
    <circle cx="930" cy="380" r="4" opacity=".7"/><circle cx="1060" cy="400" r="9" fill="#ffd166"/><circle cx="1120" cy="480" r="7"/>
  </g>
  <circle cx="1060" cy="400" r="26" fill="none" stroke="#ffd166" stroke-opacity=".45" stroke-width="2"/>
  <circle cx="1060" cy="400" r="48" fill="none" stroke="#ffd166" stroke-opacity=".18" stroke-width="2"/>

