      <stop offset="0" stop-color="#1d3b6e"/>
      <stop offset=".55" stop-color="#0f1a2e"/>
      <stop offset="1" stop-color="#0a0f19"/>
    </radialGradient>
    <pattern id="grilla" width="40" height="40" patternUnits="userSpaceOnUse">
