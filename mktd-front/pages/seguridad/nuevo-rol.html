  <style>
    /* 1. SE ADAPTA EL FONDO INTEGRADO DE LA INTRANET */
    html, body, .wrapper, .content-wrapper {
      background-color: #1b2230 !important; /* Gris oscuro mate continuo */
      margin: 0;
      padding: 0;
    }

    /* Títulos principales del módulo */
    .content-header h1, #titulo {
      color: #ffffff !important;
      font-weight: 700;
    }

    /* Ajuste de enlaces en la miga de pan */
    .breadcrumb-item + .breadcrumb-item::before {
      color: rgba(255, 255, 255, 0.4) !important;
    }
    .breadcrumb-item a {
      color: #2f81f7 !important; /* Rojo corporativo */
      font-weight: 600;
    }
    .breadcrumb-item.active, #detalleTitulo {
      color: rgba(255, 255, 255, 0.6) !important;
    }

    /* 2. DISEÑO DE LA TARJETA (CARD) */
    .content .card {
      background-color: #232c3d !important; /* Gris carbón profundo */
      border: 1px solid rgba(255, 255, 255, 0.05) !important;
      border-radius: 8px !important;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3) !important;
      color: #ffffff !important;
    }

    .content .card-header {
      border-bottom: 1px solid rgba(255, 255, 255, 0.05) !important;
    }
    
    #subtitulo {
      color: #ffffff !important;
      font-weight: 700;
    }

    /* 3. CONTROL DE FORMULARIOS (INPUTS Y CHECKBOXES) */
    .form-group label {
      color: #ffffff !important;
      font-weight: 600;
    }

    .form-control {
      background-color: rgba(255, 255, 255, 0.08) !important; /* Caja integrada oscura */
      color: #ffffff !important;
      border: 1px solid rgba(255, 255, 255, 0.15) !important;
      border-radius: 6px !important;
      transition: border-color 0.3s ease;
    }

    .form-control:focus {
      border-color: #2f81f7 !important; /* Al hacer foco se ilumina en rojo deportivo */
      box-shadow: none !important;
    }

    /* Estilo para el interruptor / checkbox de Activo */
    .custom-control-label {
      color: #ffffff !important;
      font-weight: bold !important;
      cursor: pointer;
    }
    
    .custom-control-input:checked ~ .custom-control-label::before {
      border-color: #2f81f7 !important;
      background-color: #2f81f7 !important; /* Fondo del checkbox seleccionado */
    }

    /* 4. SOLUCIÓN RADICAL PARA LA LEGIBILIDAD DEL ARBOL (HUMMINGBIRD TREEVIEW) */
    #treeview {
      color: #ffffff !important;
      font-size: 0.95rem;
      padding-left: 10px;
    }

    /* Elimina las cajas blancas cuadradas invasivas que envuelven el texto en tu captura */
    #treeview li label, 
    #treeview li,
    .hummingbird-base li label,
    .hummingbird-base label {
      background-color: transparent !important; /* Quita los fondos blancos forzados */
      color: #ffffff !important; /* Obliga a las letras a verse blancas limpias */
      font-weight: 500 !important;
      text-shadow: none !important;
    }

    /* Iconos de expandir (+) y contraer (-) del árbol */
    #treeview i.fa {
      color: rgba(255, 255, 255, 0.6) !important;
      cursor: pointer;
      margin-right: 5px;
    }
    
    #treeview i.fa:hover {
      color: #2f81f7 !important;
    }

    /* Forzar estilo a los pequeños checkboxes dentro de las ramas del árbol */
    #treeview input[type="checkbox"] {
      accent-color: #2f81f7 !important; /* Pinta los checks del árbol de color rojo de forma nativa */
      cursor: pointer;
      transform: scale(1.1);
      margin-right: 6px;
    }

    /* Línea acentuada superior de la tarjeta (.card-outline) */
    .card-primary.card-outline {
      border-top: 3px solid #2f81f7 !important;
    }

    /* 5. BOTONES DE ACCIÓN */
    .btn-custom-red {
      background-color: #2f81f7 !important;
      border-color: #2f81f7 !important;
      color: #ffffff !important;
      font-weight: 700;
      text-transform: uppercase;
      font-size: 0.8rem;
      letter-spacing: 0.5px;
      padding: 8px 20px;
      transition: all 0.3s ease;
      cursor: pointer;
    }
    .btn-custom-red:hover {
      background-color: #1f6fe0 !important;
      border-color: #1f6fe0 !important;
      color: #ffffff !important;
    }

    .btn-custom-dark {
      background-color: rgba(255, 255, 255, 0.08) !important;
      border: 1px solid rgba(255, 255, 255, 0.15) !important;
      color: rgba(255, 255, 255, 0.8) !important;
      font-weight: 700;
      text-transform: uppercase;
      font-size: 0.8rem;
      letter-spacing: 0.5px;
      padding: 8px 20px;
      border-radius: 4px;
      transition: all 0.3s ease;
      cursor: pointer;
    }
    .btn-custom-dark:hover {
      background-color: rgba(255, 255, 255, 0.15) !important;
      color: #ffffff !important;
    }

    /* Preloader */
    #preloader {
      position:fixed;
      top: 0;
      left: 0;
      background-color: #232c3d;
      width: 100%;
      height:100%;
      opacity: 0.5;
      z-index: 999999;
    }     
   </style> 

</head>
