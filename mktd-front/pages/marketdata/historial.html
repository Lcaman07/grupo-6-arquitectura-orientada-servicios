<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="x-ua-compatible" content="ie=edge">
  <title>MarketData | Historial de análisis</title>
  <link rel="icon" href="../../dist/img/marketdata-logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../../plugins/fontawesome-free/css/all.min.css">
  <link rel="stylesheet" href="../../dist/css/adminlte.min.css">
  <link rel="stylesheet" href="../../plugins/datatables-bs4/css/dataTables.bootstrap4.min.css">
  <link rel="stylesheet" href="../../plugins/datatables-responsive/css/responsive.bootstrap4.min.css">
  <link rel="stylesheet" href="../../plugins/sweetalert2-theme-bootstrap-4/bootstrap-4.min.css">
  <link href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,400i,700" rel="stylesheet">
  <link rel="stylesheet" href="../../dist/css/gwu-theme.css?v=20261010" id="gwu-theme">
  <script src="../../dist/js/pages/seguridad/aside.js?v=20261010" defer></script>
  <style>
    #preloader { position: fixed; top: 0; left: 0; background-color: #161d29; width: 100%; height: 100%; opacity: 0.5; z-index: 999999; }
  </style>
</head>
<body class="hold-transition sidebar-mini">
  <div id="preloader" class="preloader" style="display: none;"></div>
  <div class="wrapper">
    <div id="navBar"></div>
    <aside-component></aside-component>

    <div class="content-wrapper">
      <div class="content-header">
        <div class="container-fluid">
          <div class="row mb-2">
            <div class="col-sm-7"><h1 class="m-0">Historial de análisis</h1></div>
            <div class="col-sm-5">
              <ol class="breadcrumb float-sm-right">
                <li class="breadcrumb-item"><a href="../seguridad/principal.html">Inicio</a></li>
                <li class="breadcrumb-item">Análisis de mercado</li><li class="breadcrumb-item active">Historial</li>
              </ol>
            </div>
          </div>
        </div>
      </div>

      <div class="content">
        <div class="container-fluid">

          <div class="card card-primary card-outline">
            <div class="card-body">
              <div class="form-row">
                <div class="form-group col-md-3">
                  <label for="txtTexto">Zona o UBIGEO</label>
                  <input type="text" class="form-control" id="txtTexto" placeholder="Ej.: MIRAFLORES o 1501">
                </div>
                <div class="form-group col-md-2">
                  <label for="cboNivel">Nivel</label>
                  <select class="form-control" id="cboNivel"><option value="">Todos</option><option value="DEPARTAMENTO">Departamento</option><option value="PROVINCIA">Provincia</option><option value="DISTRITO">Distrito</option></select>
                </div>
                <div class="form-group col-md-2">
                  <label for="cboAtractivo">Atractivo</label>
                  <select class="form-control" id="cboAtractivo"></select>
                </div>
                <div class="form-group col-md-2">
                  <label for="txtDesde">Desde</label>
                  <input type="date" class="form-control" id="txtDesde">
                </div>
                <div class="form-group col-md-2">
                  <label for="txtHasta">Hasta</label>
                  <input type="date" class="form-control" id="txtHasta">
                </div>
                <div class="form-group col-md-1 d-flex align-items-end">
                  <button type="button" class="btn btn-primary btn-block" id="btnBuscar" title="Buscar"><i class="fas fa-search"></i></button>
                </div>
              </div>
              <div class="d-flex justify-content-between align-items-center flex-wrap">
                <div class="md-ayuda">Marca de 2 a 4 análisis para compararlos.</div>
                <div>
                  <a href="analisis-zona.html" class="btn btn-default btn-sm"><i class="fas fa-plus mr-1"></i> Nuevo análisis</a>
                  <button type="button" class="btn btn-outline-primary btn-sm" id="btnComparar" disabled><i class="fas fa-balance-scale mr-1"></i> Comparar seleccionados (<span id="lblSeleccionados">0</span>)</button>
                </div>
              </div>
            </div>
          </div>
          <div class="card">
            <div class="card-body">
              <table id="tablaHistorial" class="table table-sm table-striped mb-0" style="width: 100%;">
                <thead><tr><th></th><th>N°</th><th>Fecha</th><th>Zona</th><th>Rubro</th><th class="md-num">Población</th><th class="md-num">Empresas</th><th class="md-num">Emp./mil</th><th>Índice</th><th>Estado</th><th>Origen</th><th class="md-num">Tiempo</th><th>Usuario</th><th></th></tr></thead>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div id="footerBar"></div>
  </div>

  <script src="../../plugins/jquery/jquery.min.js"></script>
  <script src="../../plugins/bootstrap/js/bootstrap.bundle.min.js"></script>
  <script src="../../plugins/datatables/jquery.dataTables.min.js"></script>
  <script src="../../plugins/datatables-bs4/js/dataTables.bootstrap4.min.js"></script>
  <script src="../../plugins/datatables-responsive/js/dataTables.responsive.min.js"></script>
  <script src="../../plugins/datatables-responsive/js/responsive.bootstrap4.min.js"></script>
  <script src="../../dist/js/adminlte.min.js"></script>
  <script src="../../plugins/sweetalert2/sweetalert2.min.js"></script>
  <script src="../../dist/js/pages/common/common.js?v=20261010"></script>
  <script src="../../dist/js/pages/marketdata/comun-md.js?v=20261010"></script>
  <script src="../../dist/js/pages/marketdata/historial.js?v=20261010"></script>
</body>
</html>
